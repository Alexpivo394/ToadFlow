name: toadflow

# Логи контейнеров — с ротацией: без неё json-file растёт, пока не кончится диск.
x-logging: &logging
  driver: json-file
  options:
    max-size: "50m"
    max-file: "5"

services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    logging: *logging
    environment:
      POSTGRES_DB: toadflow
      POSTGRES_USER: toadflow
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?задайте POSTGRES_PASSWORD в .env}
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U toadflow -d toadflow"]
      interval: 10s
      timeout: 5s
      retries: 10

  server:
    build:
      context: ..
      dockerfile: deploy/server.Dockerfile
    restart: unless-stopped
    logging: *logging
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ConnectionStrings__Postgres: "Host=postgres;Port=5432;Database=toadflow;Username=toadflow;Password=${POSTGRES_PASSWORD}"
      Auth__JwtKey: ${JWT_KEY:?задайте JWT_KEY в .env (не короче 32 символов)}
      Admin__Login: ${ADMIN_LOGIN:-admin}
      Admin__Password: ${ADMIN_PASSWORD:?задайте ADMIN_PASSWORD в .env}
      Clash__StorageRoot: /data/clash
      Clash__EngineKey: ${CLASH_ENGINE_KEY:?задайте CLASH_ENGINE_KEY в .env — общий ключ сервера и движка коллизий}
      # Картинки коллизий рисует сервер: столько потоков одновременно
      Clash__ImageThreads: ${CLASH_IMAGE_THREADS:-2}
    # Сервер держит оглавления слепков в памяти и рисует картинки: лимит, чтобы не вытеснить PostgreSQL
    mem_limit: ${SERVER_MEMORY:-2g}
    volumes:
      # Выгрузки геометрии для коллизий: последние N на модель (Настройки → Коллизии)
      - clash:/data/clash
    # В образе aspnet нет curl: сервер сам запрашивает свой /api/health (503, если нет базы)
    healthcheck:
      test: ["CMD", "dotnet", "ToadFlow.Server.Host.dll", "--healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # Движок коллизий: прогоны по одному. Лимиты — чтобы не душить сервер и PostgreSQL на той же машине; по умолчанию
  # подходят хосту с 4 ядрами и 8 ГБ. Больше ядер и памяти — быстрее большие части (см. вики, «Сервер»).
  clash-engine:
    build:
      context: ..
      dockerfile: deploy/clash-engine.Dockerfile
    restart: unless-stopped
    logging: *logging
    depends_on:
      server:
        condition: service_healthy
    mem_limit: ${CLASH_ENGINE_MEMORY:-4g}
    cpus: ${CLASH_ENGINE_CPUS:-2}
    environment:
      Clash__ServerUrl: http://server:8080
      Clash__EngineKey: ${CLASH_ENGINE_KEY:?задайте CLASH_ENGINE_KEY в .env}
    volumes:
      - clash-engine-cache:/data/cache

  web:
    build:
      context: ..
      dockerfile: deploy/web.Dockerfile
    restart: unless-stopped
    logging: *logging
    depends_on:
      server:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-8080}:80"

volumes:
  postgres:
  clash:
  clash-engine-cache:
