name: Publish release

on:
  push:
    tags:
      - '*'
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (optional)"
        required: false
        type: string

permissions:
  contents: write

jobs:
  windows:
    name: windows-2025
    runs-on: windows-2025
    steps:

      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0

      - name: Create release tag
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.version != ''
        shell: bash
        # Ввод — через переменную окружения, а не подстановкой в текст скрипта: иначе строка версии исполнилась бы как команда.
        env:
          VERSION: ${{ github.event.inputs.version }}
        run: |
          set -e
          git tag "$VERSION"
          git push origin "$VERSION"

      - name: Cache packages
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', 'Directory.Build.props', 'Directory.Packages.props') }}
          restore-keys: ${{ runner.os }}-nuget-

      # Аддин для всех версий Revit, агент, установщик ToadFlowAgent-<версия>.msi и релиз на GitHub
      - name: Publish release
        run: dotnet run -c Release -- pack publish
        working-directory: build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DOTNET_ENVIRONMENT: ${{ (github.ref_name == 'main' || github.ref_type == 'tag') && 'Production' || 'Development' }}
          Build__Version: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.version || github.ref_name }}
